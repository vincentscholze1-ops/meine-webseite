<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 300px; margin: 0; padding: 12px; font: 13px system-ui, sans-serif; }
    h1 { font-size: 14px; margin: 0 0 10px; }
    h1 small { font-weight: 400; color: #666; }
    button { width: 100%; padding: 6px; margin-bottom: 6px; font: inherit; cursor: pointer; }
    p { color: #666; font-size: 12px; }
    #diag-out { font-size: 12px; white-space: pre-wrap; background: #f1f3f4; padding: 6px; border-radius: 4px; }
    #diag-out:empty { display: none; }
    a { display: block; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>LSS Verbands-Bot <small id="version"></small></h1>
  <button id="toggle"></button>
  <button id="stats">📊 Auswertung</button>
  <button id="diag">Diagnose (ohne Alarmierung)</button>
  <div id="diag-out"></div>
  <p>Fährt Verbands- und geplante Einsätze an. Läuft nur, solange die Hauptseite des Leitstellenspiels in einem Tab geöffnet ist.</p>
  <a href="#" id="options">Auswahl &amp; Grenzen einstellen…</a>
  <script src="vehicle-types.js"></script>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
